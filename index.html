    <meta property="og:title" content="Jusay" />

    <meta property="og:type" content="website" />

    <meta property="og:site_name" content="Jusay" />
    <meta property="og:image" content="https://jusaywebsite.vercel.app/jusay-logo.png" />
    <!-- Dimensions below are the real pixel size of public/jusay-logo.png. Keep them
         in sync with the file: a mismatch makes scrapers reject or re-crop the image. -->
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="634" />
    <meta property="og:image:height" content="638" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@jusay" />
    <meta name="twitter:title" content="Jusay" />
    <meta name="twitter:description" content="A universal voice command bar for text and actions. Speak naturally, get polished text anywhere." />
    <meta name="twitter:image" content="https://jusaywebsite.vercel.app/jusay-logo.png" />
    <meta name="twitter:image:alt" content="The Jusay logo — a system-wide voice layer for your OS." />
  </head>

  <body>
    <div id="root"></div>
    <script>
    // Catch OAuth tokens on ANY page (including root if Supabase falls back to Site URL)
    // Redirects to the dedicated callback handler so tokens get relayed to desktop app.
    (function() {
      var hash = location.hash.substring(1);
      if (!hash) hash = location.search.substring(1);
      if (hash) {
        var params = new URLSearchParams(hash);
        if (params.get('access_token') || params.get('refresh_token')) {
          // Preserve the fragment while redirecting to the callback handler
          if (location.pathname !== '/auth/callback') {
            location.replace('/auth/callback' + location.hash);
          }
        }
      }
    })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
